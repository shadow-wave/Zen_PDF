<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Liquid Drop Glow -->
    <radialGradient id="liquidGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Liquid Glass Refraction & Blur -->
    <filter id="liquidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#4f46e5" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="innerGaze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.6" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with visionOS 27 geometry -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#liquidShadow)" />
  
  <!-- Liquid Ambient Blobs -->
  <circle cx="160" cy="160" r="120" fill="url(#liquidGlow)" opacity="0.8" />
  <circle cx="360" cy="340" r="140" fill="#ec4899" opacity="0.35" />

  <!-- Glass Sheen Layer -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="url(#glassShine)" />
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" />

  <!-- Liquid Water Drop Shape -->
  <path d="M 256 110 C 256 110 160 236 160 306 C 160 360 203 402 256 402 C 309 402 352 360 352 306 C 352 236 256 110 256 110 Z" 
        fill="rgba(255, 255, 255, 0.22)" 
        stroke="rgba(255, 255, 255, 0.65)" 
        stroke-width="3"
        filter="url(#innerGaze)" />

  <!-- Droplet Highlight Arc -->
  <path d="M 200 280 C 190 320 220 360 256 368" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.85" />
        
  <!-- Floating Zen Feather Icon inside Droplet -->
  <path d="M 235 185 C 290 190 315 240 285 305 C 275 325 250 340 220 345 C 235 325 245 300 240 275 C 230 255 210 245 200 240 C 215 230 230 210 235 185 Z"
        fill="#ffffff" 
        opacity="0.95" />
  <circle cx="218" cy="345" r="4" fill="#ffffff" />
</svg>
